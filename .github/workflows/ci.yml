name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:docs
      - run: npm run docs:build
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zod-version: [4.3.6, 4.6.5]
        aws-sdk-version: [3.1037.0, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:consumer
        env:
          ZOD_VERSION: ${{ matrix.zod-version }}
          AWS_SDK_VERSION: ${{ matrix.aws-sdk-version }}
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser
  integration:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.AWS_INTEGRATION_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INTEGRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_INTEGRATION_REGION || 'eu-west-2' }}
      - run: npm ci
      - run: npm run test:integration
