name: Publish documentation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Latest stable release tag (v<version> or <version>)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Require latest stable published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          test "$RELEASE_TAG" = "$latest_tag"
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version" || test "$RELEASE_TAG" = "$version"
          published_version=$(npm view @fluentful/orm version)
          test "$version" = "$published_version"
      - run: npm ci
      - run: npm run test:docs
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
